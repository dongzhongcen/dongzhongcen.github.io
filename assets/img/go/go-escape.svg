<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" width="760" height="375" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="760" height="375" rx="12" fill="#ffffff"/>
<text x="380" y="28" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">逃逸分析：变量放栈上还是堆上，看它会不会被外面引用</text>
<rect x="30" y="60" width="330" height="270" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="195" y="82" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">栈（函数返回就回收）</text>
<rect x="400" y="60" width="330" height="270" rx="8" fill="#fff9db" stroke="#e67700" stroke-width="1.5"/>
<text x="565" y="82" font-size="15" fill="#e67700" text-anchor="middle" font-weight="bold" dominant-baseline="middle">堆（由 GC 判断是否可达再回收）</text>
<rect x="55" y="110" width="280" height="90" rx="8" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="70" y="132" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">func temp() int {</text>
<text x="85" y="154" font-size="13" fill="#1c7ed6" text-anchor="start" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">m := new(int)</text>
<text x="85" y="176" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">return *m</text>
<text x="195" y="222" font-size="13" fill="#2f9e44" text-anchor="middle" font-weight="normal" dominant-baseline="middle">m 没被外面引用 → 留在栈上</text>
<text x="195" y="244" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal" dominant-baseline="middle">（用了 new 也不一定在堆上）</text>
<rect x="425" y="110" width="280" height="90" rx="8" fill="#ffffff" stroke="#e03131" stroke-width="1.5"/>
<text x="440" y="132" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">func save() {</text>
<text x="455" y="154" font-size="13" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">n := 42</text>
<text x="455" y="176" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">keep = &amp;n</text>
<rect x="470" y="250" width="190" height="46" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="565" y="273" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">n = 42</text>
<line x1="565" y1="202" x2="565" y2="248" stroke="#e03131" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="640" y="224" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">移到堆上</text>
<rect x="225" y="262" width="110" height="34" rx="8" fill="#ffffff" stroke="#212529" stroke-width="1.5"/>
<text x="280" y="279" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">var keep</text>
<line x1="337" y1="279" x2="468" y2="273" stroke="#e03131" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="280" y="312" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal" dominant-baseline="middle">包级变量，一直活着</text>
<text x="380" y="352" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">查看编译器的决定：go build -gcflags=-m</text>
</svg>
