<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="760" height="380" rx="12" fill="#ffffff"/>
<text x="380" y="28" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">一次 RPC 调用：把信息拆成 Header 和 Body</text>
<rect x="150" y="52" width="460" height="40" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="380" y="72" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">client.Call("Arith.Multiply", args, &amp;reply)</text>
<text x="195" y="125" font-size="15" fill="#1c7ed6" text-anchor="middle" font-weight="bold" dominant-baseline="middle">请求（客户端 → 服务端）</text>
<rect x="40" y="145" width="310" height="120" rx="8" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="60" y="165" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="bold" dominant-baseline="middle">Header</text>
<text x="60" y="190" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">ServiceMethod: "Arith.Multiply"</text>
<text x="60" y="212" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Seq: 1</text>
<text x="60" y="234" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Error: ""</text>
<rect x="40" y="275" width="310" height="50" rx="8" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="60" y="300" font-size="14" fill="#1c7ed6" text-anchor="start" font-weight="bold" dominant-baseline="middle">Body</text>
<text x="120" y="300" font-size="14" fill="#212529" text-anchor="start" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">args</text>
<text x="565" y="125" font-size="15" fill="#e03131" text-anchor="middle" font-weight="bold" dominant-baseline="middle">响应（服务端 → 客户端）</text>
<rect x="410" y="145" width="310" height="120" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="430" y="165" font-size="14" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle">Header</text>
<text x="430" y="190" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">ServiceMethod: "Arith.Multiply"</text>
<text x="430" y="212" font-size="13" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Seq: 1</text>
<text x="430" y="234" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Error: "出错时才填"</text>
<rect x="410" y="275" width="310" height="50" rx="8" fill="#ffffff" stroke="#e03131" stroke-width="1.5"/>
<text x="430" y="300" font-size="14" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle">Body</text>
<text x="490" y="300" font-size="14" fill="#212529" text-anchor="start" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">reply</text>
<line x1="352" y1="205" x2="406" y2="205" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="380" y="355" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal" dominant-baseline="middle">参数和返回值都放进 Body，其余信息放进 Header；Seq 相同，客户端就知道这是哪个请求的响应</text>
</svg>
