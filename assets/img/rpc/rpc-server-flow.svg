<rect x="60" y="288" width="270" height="215" rx="8" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="195" y="308" font-size="14" fill="#1c7ed6" text-anchor="middle" font-weight="bold" dominant-baseline="middle">serveCodec：for 循环</text>
<rect x="85" y="325" width="220" height="34" rx="8" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="195.0" y="342.0" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">readRequest</text>
<line x1="195" y1="361" x2="195" y2="381" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="85" y="383" width="220" height="34" rx="8" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="195.0" y="400.0" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">go handleRequest</text>
<line x1="195" y1="419" x2="195" y2="439" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="85" y="441" width="220" height="34" rx="8" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="195.0" y="458.0" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">sendResponse（加锁）</text>
<text x="195" y="490" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal" dominant-baseline="middle">header 读失败才退出循环，wg.Wait() 后关闭</text>
<rect x="370" y="350" width="330" height="150" rx="8" fill="#ffffff" stroke="#e03131" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="390" y="372" font-size="14" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle">并发处理，逐个回复</text>
<text x="390" y="400" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">• 每个请求一个 goroutine 并发处理</text>
<text x="390" y="425" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">• 回复时用 sending 互斥锁，</text>
<text x="390" y="447" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">  一个响应写完才能写下一个</text>
<text x="390" y="475" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">• WaitGroup 等所有请求处理完</text>
</svg>
