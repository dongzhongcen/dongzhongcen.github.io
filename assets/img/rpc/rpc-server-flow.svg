<text x="380.0" y="139.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">go ServeConn(conn)</text>
<rect x="520" y="120" width="200" height="38" rx="8" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="620.0" y="139.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">go ServeConn(conn)</text>
<line x1="380" y1="88" x2="140" y2="118" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="380" y1="88" x2="380" y2="118" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="380" y1="88" x2="620" y2="118" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="380" y="176" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal" dominant-baseline="middle">每个连接一个 goroutine，下面看其中一个</text>
<rect x="40" y="190" width="680" height="330" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="70" y="205" width="250" height="38" rx="8" fill="#fff9db" stroke="#e67700" stroke-width="1.5"/>
<text x="195.0" y="224.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">JSON 解码 Option</text>
<rect x="400" y="205" width="290" height="38" rx="8" fill="#fff9db" stroke="#e67700" stroke-width="1.5"/>
<text x="545.0" y="224.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">检查 MagicNumber / CodecType</text>
<line x1="322" y1="224" x2="398" y2="224" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="545" y="258" font-size="12" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">不对就直接关闭连接</text>
