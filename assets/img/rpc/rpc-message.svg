<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="760" height="360" rx="12" fill="#ffffff"/>
<text x="380" y="28" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">一个连接里的报文：Option 只发一次，后面是多组 Header + Body</text>
<rect x="40" y="80" width="140" height="56" rx="4" fill="#fff9db" stroke="#e67700" stroke-width="1.5"/>
<text x="110.0" y="108" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Option</text>
<rect x="184" y="80" width="105" height="56" rx="4" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="236.5" y="108" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Header1</text>
<rect x="293" y="80" width="95" height="56" rx="4" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="340.5" y="108" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Body1</text>
<rect x="392" y="80" width="105" height="56" rx="4" fill="#d0ebff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="444.5" y="108" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Header2</text>
<rect x="501" y="80" width="95" height="56" rx="4" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="548.5" y="108" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Body2</text>
<rect x="600" y="80" width="60" height="56" rx="4" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="630.0" y="108" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">…</text>
<line x1="40" y1="155" x2="180" y2="155" stroke="#e67700" stroke-width="2"/>
<line x1="40" y1="148" x2="40" y2="162" stroke="#e67700" stroke-width="2"/>
<line x1="180" y1="148" x2="180" y2="162" stroke="#e67700" stroke-width="2"/>
<text x="110" y="178" font-size="14" fill="#e67700" text-anchor="middle" font-weight="bold" dominant-baseline="middle">固定用 JSON 编码</text>
<line x1="184" y1="155" x2="700" y2="155" stroke="#1c7ed6" stroke-width="2"/>
<line x1="184" y1="148" x2="184" y2="162" stroke="#1c7ed6" stroke-width="2"/>
<line x1="700" y1="148" x2="700" y2="162" stroke="#1c7ed6" stroke-width="2"/>
<text x="442" y="178" font-size="14" fill="#1c7ed6" text-anchor="middle" font-weight="bold" dominant-baseline="middle">编码方式由 Option.CodecType 决定（目前是 gob）</text>
<rect x="40" y="210" width="680" height="130" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="235" font-size="13" fill="#e67700" text-anchor="start" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">{"MagicNumber":3927900,"CodecType":"application/gob"}</text>
<text x="60" y="265" font-size="13" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">MagicNumber</text>
<text x="200" y="265" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">魔数 0x3bef5c，服务端用它判断“这是不是我的协议”</text>
<text x="60" y="290" font-size="13" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">CodecType</text>
<text x="200" y="290" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">告诉服务端后面的 Header 和 Body 用什么方式解码</text>
<text x="60" y="315" font-size="13" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle" font-family="Consolas,Menlo,monospace">Header / Body</text>
<text x="200" y="315" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">成对出现，一个连接里可以连续发很多组</text>
</svg>
