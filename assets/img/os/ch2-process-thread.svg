<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" width="760" height="455" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="760" height="455" rx="12" fill="#ffffff"/>
<text x="380" y="26" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">单线程进程 vs 多线程进程</text>
<rect x="40" y="50" width="180" height="300" rx="12" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/><text x="130.0" y="70" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">单线程进程</text><rect x="55" y="90" width="150" height="70" rx="6" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="130.0" y="112" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="bold" dominant-baseline="middle">进程拥有的资源（线程共享）</text><text x="130.0" y="138" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">代码段 · 数据段 · 打开的文件</text><rect x="55" y="175" width="90" height="160" rx="6" fill="#fff3bf" stroke="none" stroke-width="1.5"/><text x="100" y="195" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">线程</text><rect x="63" y="212" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="100" y="227" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">寄存器</text><rect x="63" y="250" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="100" y="265" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">栈</text><rect x="63" y="288" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="100" y="303" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">TCB</text>
<rect x="300" y="50" width="320" height="300" rx="12" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/><text x="460.0" y="70" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">多线程进程</text><rect x="315" y="90" width="290" height="70" rx="6" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="460.0" y="112" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="bold" dominant-baseline="middle">进程拥有的资源（线程共享）</text><text x="460.0" y="138" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">代码段 · 数据段 · 打开的文件</text><rect x="315" y="175" width="90" height="160" rx="6" fill="#fff3bf" stroke="none" stroke-width="1.5"/><text x="360" y="195" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">线程1</text><rect x="323" y="212" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="360" y="227" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">寄存器</text><rect x="323" y="250" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="360" y="265" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">栈</text><rect x="323" y="288" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="360" y="303" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">TCB</text><rect x="415" y="175" width="90" height="160" rx="6" fill="#fff3bf" stroke="none" stroke-width="1.5"/><text x="460" y="195" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">线程2</text><rect x="423" y="212" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="460" y="227" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">寄存器</text><rect x="423" y="250" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="460" y="265" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">栈</text><rect x="423" y="288" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="460" y="303" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">TCB</text><rect x="515" y="175" width="90" height="160" rx="6" fill="#fff3bf" stroke="none" stroke-width="1.5"/><text x="560" y="195" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">线程3</text><rect x="523" y="212" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="560" y="227" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">寄存器</text><rect x="523" y="250" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="560" y="265" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">栈</text><rect x="523" y="288" width="74" height="30" rx="4" fill="#fff" stroke="#868e96" stroke-width="1.5"/><text x="560" y="303" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">TCB</text>
<text x="380" y="410" font-size="14" fill="#e03131" text-anchor="middle" font-weight="bold" dominant-baseline="middle">进程是拥有资源的基本单位，线程是调度和分派的基本单位</text>
<text x="380" y="435" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">同一进程的线程共享资源，每个线程只保留自己运行必需的寄存器、栈和 TCB</text>
</svg>
