<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="760" height="350" rx="12" fill="#ffffff"/>
<text x="380" y="28" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">用户态到内核态的切换（系统调用）</text>
<rect x="40" y="55" width="600" height="110" rx="8" fill="#ffffff" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="75" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">用户程序</text>
<rect x="40" y="195" width="600" height="110" rx="8" fill="#e7e9fb" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="215" font-size="13" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">内核</text>
<line x1="30" y1="180" x2="730" y2="180" stroke="#212529" stroke-width="2" stroke-dasharray="10 6"/>
<rect x="70" y="95" width="130" height="38" rx="4" fill="#fff" stroke="#212529" stroke-width="1.5"/>
<text x="135" y="114" font-size="14" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">执行用户程序</text>
<rect x="250" y="95" width="130" height="38" rx="4" fill="#fff" stroke="#212529" stroke-width="1.5"/>
<text x="315" y="114" font-size="14" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">调用系统调用</text>
<rect x="470" y="95" width="140" height="38" rx="4" fill="#fff" stroke="#212529" stroke-width="1.5"/>
<text x="540" y="114" font-size="14" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">从系统调用返回</text>
<rect x="340" y="245" width="140" height="38" rx="4" fill="#fff" stroke="#212529" stroke-width="1.5"/>
<text x="410" y="264" font-size="14" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">执行系统调用</text>
<line x1="200" y1="114" x2="248" y2="114" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="330" y1="133" x2="380" y2="243" stroke="#e03131" stroke-width="2" marker-end="url(#arr)"/>
<text x="300" y="210" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">陷入（trap）</text>
<text x="300" y="230" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">模式位 = 0</text>
<line x1="445" y1="245" x2="520" y2="135" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ar)"/>
<text x="540" y="210" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="normal" dominant-baseline="middle">返回</text>
<text x="540" y="230" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="normal" dominant-baseline="middle">模式位 = 1</text>
<text x="700" y="110" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">用户态</text>
<text x="700" y="132" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal" dominant-baseline="middle">模式位 = 1</text>
<text x="700" y="250" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">内核态</text>
<text x="700" y="272" font-size="12" fill="#868e96" text-anchor="middle" font-weight="normal" dominant-baseline="middle">模式位 = 0</text>
<text x="380" y="330" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">中断、异常或系统调用发生时，硬件自动切到内核态；特权指令只能在内核态执行</text>
</svg>
