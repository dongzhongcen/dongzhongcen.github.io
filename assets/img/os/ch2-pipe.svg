<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" width="760" height="395" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="760" height="395" rx="12" fill="#ffffff"/>
<text x="380" y="26" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">无名管道：fork 之后子进程写、父进程读</text>
<rect x="30" y="60" width="220" height="110" rx="10" fill="#d0ebff" stroke="none" stroke-width="1.5"/>
<text x="140" y="82" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">父进程（读）</text>
<text x="140" y="112" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">close(fd[1])  关掉写端</text>
<text x="140" y="140" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="normal" dominant-baseline="middle">read(fd[0], buf, …)</text>
<rect x="510" y="60" width="220" height="110" rx="10" fill="#fff3bf" stroke="none" stroke-width="1.5"/>
<text x="620" y="82" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">子进程（写）</text>
<text x="620" y="112" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">close(fd[0])  关掉读端</text>
<text x="620" y="140" font-size="13" fill="#e67700" text-anchor="middle" font-weight="normal" dominant-baseline="middle">write(fd[1], "test data")</text>
<rect x="200" y="225" width="360" height="74" rx="30" fill="#f1f3f5" stroke="#212529" stroke-width="1.5"/>
<text x="380" y="247" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">管道 pipe（内核里的一块缓冲区）</text>
<text x="200" y="318" font-size="13" fill="#1c7ed6" text-anchor="middle" font-weight="normal" dominant-baseline="middle">读端 fd[0]</text>
<text x="560" y="318" font-size="13" fill="#e67700" text-anchor="middle" font-weight="normal" dominant-baseline="middle">写端 fd[1]</text>
<line x1="620" y1="170" x2="540" y2="228" stroke="#e67700" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="220" y1="228" x2="140" y2="172" stroke="#1c7ed6" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="500" y1="276" x2="262" y2="276" stroke="#e03131" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="380" y="215" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">数据单向流动："test data"</text>
<text x="380" y="345" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">pipe(fd) 创建管道，fork() 后父子进程都拿着 fd[0] 和 fd[1]，各自关掉不用的那一端</text>
<text x="380" y="370" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">无名管道只能在有亲缘关系的进程（如父子）之间使用；有名管道 FIFO 有文件名，无关进程也能用</text>
</svg>
