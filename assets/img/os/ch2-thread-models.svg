<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="780" height="370" rx="12" fill="#ffffff"/>
<text x="390" y="26" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">用户级线程（ULT）与内核线程（KLT）的三种组合模型</text>
<text x="140" y="60" font-size="16" fill="#e03131" text-anchor="middle" font-weight="bold" dominant-baseline="middle">多对一</text><rect x="20" y="75" width="240" height="90" rx="8" fill="#fff3bf" stroke="none" stroke-width="1.5"/><text x="28" y="90" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">用户空间</text><rect x="20" y="190" width="240" height="80" rx="8" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="28" y="205" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">内核空间</text><line x1="57.5" y1="138" x2="140.0" y2="222" stroke="#212529" stroke-width="1.4"/><line x1="112.5" y1="138" x2="140.0" y2="222" stroke="#212529" stroke-width="1.4"/><line x1="167.5" y1="138" x2="140.0" y2="222" stroke="#212529" stroke-width="1.4"/><line x1="222.5" y1="138" x2="140.0" y2="222" stroke="#212529" stroke-width="1.4"/><circle cx="57.5" cy="125" r="16" fill="#fab005"/><text x="57.5" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="112.5" cy="125" r="16" fill="#fab005"/><text x="112.5" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="167.5" cy="125" r="16" fill="#fab005"/><text x="167.5" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="222.5" cy="125" r="16" fill="#fab005"/><text x="222.5" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="140.0" cy="235" r="16" fill="#1c7ed6"/><text x="140.0" y="235" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">K</text><text x="140" y="295" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">一个线程阻塞，整个进程阻塞</text><text x="140" y="315" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">不能利用多处理机并行</text>
<text x="390" y="60" font-size="16" fill="#e03131" text-anchor="middle" font-weight="bold" dominant-baseline="middle">一对一</text><rect x="270" y="75" width="240" height="90" rx="8" fill="#fff3bf" stroke="none" stroke-width="1.5"/><text x="278" y="90" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">用户空间</text><rect x="270" y="190" width="240" height="80" rx="8" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="278" y="205" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">内核空间</text><line x1="335.0" y1="138" x2="335.0" y2="222" stroke="#212529" stroke-width="1.4"/><line x1="390.0" y1="138" x2="390.0" y2="222" stroke="#212529" stroke-width="1.4"/><line x1="445.0" y1="138" x2="445.0" y2="222" stroke="#212529" stroke-width="1.4"/><circle cx="335.0" cy="125" r="16" fill="#fab005"/><text x="335.0" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="390.0" cy="125" r="16" fill="#fab005"/><text x="390.0" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="445.0" cy="125" r="16" fill="#fab005"/><text x="445.0" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="335.0" cy="235" r="16" fill="#1c7ed6"/><text x="335.0" y="235" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">K</text><circle cx="390.0" cy="235" r="16" fill="#1c7ed6"/><text x="390.0" y="235" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">K</text><circle cx="445.0" cy="235" r="16" fill="#1c7ed6"/><text x="445.0" y="235" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">K</text><text x="390" y="295" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">并发性好，可在多处理机上并行</text><text x="390" y="315" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">每建一个 ULT 就要建一个 KLT，开销大</text>
<text x="640" y="60" font-size="16" fill="#e03131" text-anchor="middle" font-weight="bold" dominant-baseline="middle">多对多</text><rect x="520" y="75" width="240" height="90" rx="8" fill="#fff3bf" stroke="none" stroke-width="1.5"/><text x="528" y="90" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">用户空间</text><rect x="520" y="190" width="240" height="80" rx="8" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="528" y="205" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">内核空间</text><line x1="557.5" y1="138" x2="612.5" y2="222" stroke="#212529" stroke-width="1.4"/><line x1="612.5" y1="138" x2="612.5" y2="222" stroke="#212529" stroke-width="1.4"/><line x1="667.5" y1="138" x2="667.5" y2="222" stroke="#212529" stroke-width="1.4"/><line x1="722.5" y1="138" x2="667.5" y2="222" stroke="#212529" stroke-width="1.4"/><circle cx="557.5" cy="125" r="16" fill="#fab005"/><text x="557.5" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="612.5" cy="125" r="16" fill="#fab005"/><text x="612.5" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="667.5" cy="125" r="16" fill="#fab005"/><text x="667.5" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="722.5" cy="125" r="16" fill="#fab005"/><text x="722.5" y="125" font-size="13" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">U</text><circle cx="612.5" cy="235" r="16" fill="#1c7ed6"/><text x="612.5" y="235" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">K</text><circle cx="667.5" cy="235" r="16" fill="#1c7ed6"/><text x="667.5" y="235" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" dominant-baseline="middle">K</text><text x="640" y="295" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">KLT 数量 ≤ ULT 数量</text><text x="640" y="315" font-size="12" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">兼顾前两者的优点</text>
<text x="390" y="350" font-size="13" fill="#868e96" text-anchor="middle" font-weight="normal" dominant-baseline="middle">U：用户级线程    K：内核支持线程</text>
</svg>
