<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker></defs>
<rect width="760" height="400" rx="12" fill="#ffffff"/>
<text x="380.0" y="28" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">资源分配图：有没有死锁</text>
<text x="190" y="62" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">（a）R1、R2 各 1 个实例</text>
<circle cx="80" cy="180" r="28" fill="#fff" stroke="#212529" stroke-width="1.6"/><text x="80" y="180" font-size="15" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">P1</text>
<circle cx="300" cy="180" r="28" fill="#fff" stroke="#212529" stroke-width="1.6"/><text x="300" y="180" font-size="15" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">P2</text>
<rect x="150" y="80" width="80" height="46" rx="6" fill="#f8f9fa" stroke="#212529" stroke-width="1.6"/>
<text x="190" y="70" font-size="1" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle"></text>
<text x="252" y="92" font-size="14" fill="#212529" text-anchor="start" font-weight="bold" dominant-baseline="middle">R1</text>
<rect x="150" y="236" width="80" height="46" rx="6" fill="#f8f9fa" stroke="#212529" stroke-width="1.6"/>
<text x="252" y="270" font-size="14" fill="#212529" text-anchor="start" font-weight="bold" dominant-baseline="middle">R2</text>
<circle cx="190" cy="103" r="6" fill="#212529"/><circle cx="190" cy="259" r="6" fill="#212529"/><line x1="184" y1="109" x2="100" y2="160" stroke="#1c7ed6" stroke-width="1.6" marker-end="url(#arb)"/>
<line x1="196" y1="253" x2="282" y2="200" stroke="#1c7ed6" stroke-width="1.6" marker-end="url(#arb)"/>
<line x1="102" y1="198" x2="150" y2="250" stroke="#e03131" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<line x1="282" y1="160" x2="232" y2="118" stroke="#e03131" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="190" y="318" font-size="14" fill="#e03131" text-anchor="middle" font-weight="bold" dominant-baseline="middle">一条边都擦不掉：死锁</text>
<text x="570" y="62" font-size="15" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">（b）R1 改成 2 个实例</text>
<circle cx="460" cy="180" r="28" fill="#fff" stroke="#212529" stroke-width="1.6"/><text x="460" y="180" font-size="15" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">P1</text>
<circle cx="680" cy="180" r="28" fill="#fff" stroke="#212529" stroke-width="1.6"/><text x="680" y="180" font-size="15" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">P2</text>
<rect x="530" y="80" width="80" height="46" rx="6" fill="#f8f9fa" stroke="#212529" stroke-width="1.6"/>
<text x="570" y="70" font-size="1" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle"></text>
<text x="632" y="92" font-size="14" fill="#212529" text-anchor="start" font-weight="bold" dominant-baseline="middle">R1</text>
<rect x="530" y="236" width="80" height="46" rx="6" fill="#f8f9fa" stroke="#212529" stroke-width="1.6"/>
<text x="632" y="270" font-size="14" fill="#212529" text-anchor="start" font-weight="bold" dominant-baseline="middle">R2</text>
<circle cx="552" cy="103" r="6" fill="#212529"/><circle cx="588" cy="103" r="6" fill="#212529"/><circle cx="570" cy="259" r="6" fill="#212529"/><line x1="546" y1="109" x2="480" y2="160" stroke="#1c7ed6" stroke-width="1.6" marker-end="url(#arb)"/>
<line x1="576" y1="253" x2="662" y2="200" stroke="#1c7ed6" stroke-width="1.6" marker-end="url(#arb)"/>
<line x1="482" y1="198" x2="530" y2="250" stroke="#e03131" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<line x1="662" y1="160" x2="612" y2="118" stroke="#e03131" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="570" y="318" font-size="14" fill="#2b8a3e" text-anchor="middle" font-weight="bold" dominant-baseline="middle">先擦 P2，再擦 P1：没有死锁</text>
<line x1="240" y1="365" x2="290" y2="365" stroke="#1c7ed6" stroke-width="1.6" marker-end="url(#arb)"/>
<text x="300" y="365" font-size="13" fill="#1c7ed6" text-anchor="start" font-weight="normal" dominant-baseline="middle">分配边（资源实例 → 进程）</text>
<line x1="500" y1="365" x2="550" y2="365" stroke="#e03131" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="560" y="365" font-size="13" fill="#e03131" text-anchor="start" font-weight="normal" dominant-baseline="middle">请求边（进程 → 资源）</text>
</svg>
