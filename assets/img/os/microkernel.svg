<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="800" height="320" rx="12" fill="#ffffff"/>
<text x="400" y="28" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">微内核结构：客户/服务器模式</text>
<rect x="30" y="60" width="86" height="50" rx="4" fill="#fff3bf" stroke="#212529" stroke-width="1.5"/>
<text x="73.0" y="85" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">客户进程</text>
<rect x="124" y="60" width="86" height="50" rx="4" fill="#fff3bf" stroke="#212529" stroke-width="1.5"/>
<text x="167.0" y="85" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">客户进程</text>
<rect x="218" y="60" width="96" height="50" rx="4" fill="#d0ebff" stroke="#212529" stroke-width="1.5"/>
<text x="266.0" y="85" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">进程服务器</text>
<rect x="322" y="60" width="120" height="50" rx="4" fill="#d0ebff" stroke="#212529" stroke-width="1.5"/>
<text x="382.0" y="85" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">I/O 设备服务器</text>
<rect x="450" y="60" width="96" height="50" rx="4" fill="#d0ebff" stroke="#212529" stroke-width="1.5"/>
<text x="498.0" y="85" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">文件服务器</text>
<rect x="554" y="60" width="110" height="50" rx="4" fill="#d0ebff" stroke="#212529" stroke-width="1.5"/>
<text x="609.0" y="85" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">存储器服务器</text>
<text x="730" y="85" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">用户态</text>
<rect x="30" y="195" width="644" height="50" rx="6" fill="#495057" stroke="none" stroke-width="1.5"/>
<text x="352" y="220" font-size="14" fill="#fff" text-anchor="middle" font-weight="normal" dominant-baseline="middle">微内核：进程管理、低级存储器管理、中断和陷入处理</text>
<text x="730" y="220" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">内核态</text>
<line x1="20" y1="152" x2="770" y2="152" stroke="#868e96" stroke-width="1.5" stroke-dasharray="8 5"/>
<line x1="73.0" y1="112" x2="143.0" y2="193" stroke="#e03131" stroke-width="2" marker-end="url(#arr)"/>
<text x="168.0" y="135" font-size="13" fill="#e03131" text-anchor="start" font-weight="normal" dominant-baseline="middle">① 发送请求</text>
<line x1="448.0" y1="193" x2="498.0" y2="112" stroke="#1c7ed6" stroke-width="2" marker-end="url(#ar)"/>
<text x="438.0" y="175" font-size="13" fill="#1c7ed6" text-anchor="end" font-weight="normal" dominant-baseline="middle">② 内核转发给文件服务器</text>
<text x="400" y="275" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">客户进程和服务器之间不直接调用，而是经过微内核传递消息</text>
<text x="400" y="300" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">优点：可扩展、可靠、可移植；缺点：多次消息传递和态切换，效率较低</text>
</svg>
