<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="800" height="420" rx="12" fill="#ffffff"/>
<text x="400" y="26" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">同步通信 vs 异步通信（以用户注册为例）</text>
<text x="20" y="62" font-size="14" fill="#212529" text-anchor="start" font-weight="bold" dominant-baseline="middle">（a）同步：注册服务依次调用邮件、短信服务，每一步都要等对方返回</text>
<rect x="30" y="85" width="130" height="54" rx="8" fill="#e9ecef" stroke="none" stroke-width="1.5"/><text x="95.0" y="104.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">用户</text><text x="95.0" y="124.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">发起注册</text>
<rect x="200" y="85" width="130" height="54" rx="8" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="265.0" y="104.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">注册服务</text><text x="265.0" y="124.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">写数据库 50ms</text>
<rect x="370" y="85" width="130" height="54" rx="8" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="435.0" y="104.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">邮件服务</text><text x="435.0" y="124.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">发邮件 50ms</text>
<rect x="540" y="85" width="130" height="54" rx="8" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="605.0" y="104.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">短信服务</text><text x="605.0" y="124.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">发短信 50ms</text>
<line x1="160" y1="104" x2="197" y2="104" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="200" y1="122" x2="163" y2="122" stroke="#868e96" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="330" y1="104" x2="367" y2="104" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="370" y1="122" x2="333" y2="122" stroke="#868e96" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="500" y1="104" x2="537" y2="104" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="540" y1="122" x2="503" y2="122" stroke="#868e96" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="780" y="62" font-size="11" fill="#868e96" text-anchor="end" font-weight="normal" dominant-baseline="middle">实线：发请求　虚线：等待返回</text>
<text x="700" y="104" font-size="13" fill="#e03131" text-anchor="start" font-weight="normal" dominant-baseline="middle">总耗时</text>
<text x="700" y="124" font-size="15" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle">≈ 150ms</text>
<text x="400" y="168" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">一个下游服务慢了或挂了，整个注册就跟着慢或失败（耦合紧）</text>
<text x="20" y="210" font-size="14" fill="#212529" text-anchor="start" font-weight="bold" dominant-baseline="middle">（b）异步：注册服务把“注册成功”消息丢进 MQ 就返回，邮件、短信服务自己去 MQ 里取</text>
<rect x="30" y="265" width="130" height="54" rx="8" fill="#e9ecef" stroke="none" stroke-width="1.5"/><text x="95.0" y="284.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">用户</text><text x="95.0" y="304.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">发起注册</text>
<rect x="200" y="265" width="130" height="54" rx="8" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="265.0" y="284.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">注册服务</text><text x="265.0" y="304.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">写库 50ms + 发消息</text>
<rect x="370" y="265" width="130" height="54" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="435.0" y="281" font-size="14" fill="#e67700" text-anchor="middle" font-weight="bold" dominant-baseline="middle">MQ</text><rect x="388" y="293" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="412" y="293" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="436" y="293" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="460" y="293" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/>
<rect x="560" y="235" width="130" height="48" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/><text x="625.0" y="251.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">邮件服务</text><text x="625.0" y="271.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">消费消息，发邮件</text>
<rect x="560" y="305" width="130" height="48" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/><text x="625.0" y="321.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">短信服务</text><text x="625.0" y="341.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">消费消息，发短信</text>
<line x1="160" y1="292" x2="197" y2="292" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="330" y1="292" x2="367" y2="292" stroke="#e67700" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="348" y="280" font-size="11" fill="#e67700" text-anchor="middle" font-weight="normal" dominant-baseline="middle">发送</text>
<line x1="500" y1="285" x2="557" y2="262" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="500" y1="300" x2="557" y2="326" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M265 265 C 265 240, 95 240, 95 262" stroke="#e03131" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="180" y="238" font-size="12" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">立即返回“注册成功”</text>
<text x="705" y="282" font-size="13" fill="#e03131" text-anchor="start" font-weight="normal" dominant-baseline="middle">总耗时</text>
<text x="705" y="302" font-size="15" fill="#e03131" text-anchor="start" font-weight="bold" dominant-baseline="middle">≈ 55ms</text>
<text x="400" y="385" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">生产者只管发，消费者只管收，双方互不等待；下游出问题不影响注册本身（解耦）</text>
<text x="400" y="405" font-size="11" fill="#868e96" text-anchor="middle" font-weight="normal" dominant-baseline="middle">图中耗时只是举例，用来对比两种方式的差别</text>
</svg>
