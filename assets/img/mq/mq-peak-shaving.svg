<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="800" height="340" rx="12" fill="#ffffff"/>
<text x="400" y="26" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">流量削峰：MQ 把瞬间的请求高峰“摊平”</text>
<text x="170" y="58" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">没有 MQ：请求直接打到系统</text><line x1="40" y1="250" x2="310" y2="250" stroke="#868e96" stroke-width="1.6" marker-end="url(#ar)"/><line x1="40" y1="250" x2="40" y2="75" stroke="#868e96" stroke-width="1.6" marker-end="url(#ar)"/><text x="320" y="255" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">时间</text><text x="44" y="72" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">请求量</text><path d="M40 230 L90 225 L120 220 L140 90 L160 85 L180 100 L200 210 L240 225 L310 230" stroke="#e03131" stroke-width="2.5" fill="none"/><line x1="40" y1="180" x2="310" y2="180" stroke="#e67700" stroke-width="1.6" stroke-dasharray="6 4"/><text x="310" y="170" font-size="11" fill="#e67700" text-anchor="end" font-weight="normal" dominant-baseline="middle">系统最大处理能力</text>
<text x="170" y="140" font-size="12" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">超出部分系统扛不住</text>
<rect x="345" y="140" width="110" height="54" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="400.0" y="156" font-size="14" fill="#e67700" text-anchor="middle" font-weight="bold" dominant-baseline="middle">MQ 缓冲</text><rect x="363" y="168" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="387" y="168" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="411" y="168" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="435" y="168" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/>
<line x1="330" y1="167" x2="343" y2="167" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="457" y1="167" x2="470" y2="167" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="620" y="58" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">有 MQ：系统按自己的能力匀速消费</text><line x1="490" y1="250" x2="760" y2="250" stroke="#868e96" stroke-width="1.6" marker-end="url(#ar)"/><line x1="490" y1="250" x2="490" y2="75" stroke="#868e96" stroke-width="1.6" marker-end="url(#ar)"/><text x="770" y="255" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">时间</text><text x="494" y="72" font-size="11" fill="#868e96" text-anchor="start" font-weight="normal" dominant-baseline="middle">请求量</text><path d="M490 230 L540 225 L570 220 L590 180 L630 180 L670 180 L710 180 L730 220 L760 230" stroke="#1c7ed6" stroke-width="2.5" fill="none"/><line x1="490" y1="180" x2="760" y2="180" stroke="#e67700" stroke-width="1.6" stroke-dasharray="6 4"/><text x="760" y="170" font-size="11" fill="#e67700" text-anchor="end" font-weight="normal" dominant-baseline="middle">系统最大处理能力</text>
<text x="400" y="295" font-size="13" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">例子：12306 放票、秒杀抢购，瞬间几十万请求先排进 MQ，后端每秒只处理自己扛得住的量</text>
<text x="400" y="318" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">代价：高峰期的请求要排队，响应会慢一点，但系统不会被压垮</text>
</svg>
