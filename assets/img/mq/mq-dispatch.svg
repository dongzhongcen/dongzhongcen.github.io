<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" width="800" height="365" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="800" height="365" rx="12" fill="#ffffff"/>
<text x="400" y="26" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">消息分发：一条“支付成功”消息，多个系统各取所需</text>
<rect x="30" y="150" width="130" height="54" rx="8" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="95.0" y="169.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">支付服务</text><text x="95.0" y="189.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">生产者</text>
<rect x="240" y="150" width="140" height="54" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="310.0" y="166" font-size="14" fill="#e67700" text-anchor="middle" font-weight="bold" dominant-baseline="middle">MQ</text><rect x="258" y="178" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="282" y="178" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="306" y="178" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="330" y="178" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/>
<line x1="160" y1="177" x2="237" y2="177" stroke="#e67700" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="198" y="165" font-size="11" fill="#e67700" text-anchor="middle" font-weight="normal" dominant-baseline="middle">支付成功</text>
<rect x="520" y="55" width="150" height="50" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/><text x="595.0" y="72.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">订单服务</text><text x="595.0" y="92.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">改订单状态为已支付</text>
<line x1="380" y1="177" x2="517" y2="80" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="520" y="125" width="150" height="50" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/><text x="595.0" y="142.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">库存服务</text><text x="595.0" y="162.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">扣减库存</text>
<line x1="380" y1="177" x2="517" y2="150" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="520" y="195" width="150" height="50" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/><text x="595.0" y="212.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">积分服务</text><text x="595.0" y="232.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">给用户加积分</text>
<line x1="380" y1="177" x2="517" y2="220" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="520" y="265" width="150" height="50" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/><text x="595.0" y="282.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">通知服务</text><text x="595.0" y="302.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">发短信/推送</text>
<line x1="380" y1="177" x2="517" y2="290" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="400" y="345" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">支付服务只发一次消息，不需要知道有哪些系统关心它；以后新增系统，只要订阅这条消息即可</text>
</svg>
