<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs>
<rect width="800" height="300" rx="12" fill="#ffffff"/>
<text x="400" y="26" font-size="18" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">延时通知：下单 30 分钟未支付，自动取消订单</text>
<rect x="30" y="90" width="120" height="54" rx="8" fill="#e9ecef" stroke="none" stroke-width="1.5"/><text x="90.0" y="117.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">用户下单</text>
<rect x="190" y="90" width="130" height="54" rx="8" fill="#d0ebff" stroke="none" stroke-width="1.5"/><text x="255.0" y="109.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">订单服务</text><text x="255.0" y="129.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">发送延时消息</text>
<rect x="360" y="90" width="150" height="54" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/><text x="435.0" y="106" font-size="14" fill="#e67700" text-anchor="middle" font-weight="bold" dominant-baseline="middle">延时队列 30 分钟</text><rect x="378" y="118" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="402" y="118" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="426" y="118" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/><rect x="450" y="118" width="18" height="16" rx="2" fill="#e67700" stroke="none" stroke-width="1.5"/>
<rect x="560" y="90" width="150" height="54" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/><text x="635.0" y="109.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">订单服务</text><text x="635.0" y="129.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">30 分钟后收到消息</text>
<line x1="150" y1="117" x2="187" y2="117" stroke="#212529" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="320" y1="117" x2="357" y2="117" stroke="#e67700" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="510" y1="117" x2="557" y2="117" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="470" y="200" width="130" height="44" rx="8" fill="#d3f9d8" stroke="none" stroke-width="1.5"/><text x="535.0" y="214.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">已支付</text><text x="535.0" y="234.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">什么也不做</text>
<rect x="630" y="200" width="130" height="44" rx="8" fill="#ffc9c9" stroke="none" stroke-width="1.5"/><text x="695.0" y="214.0" font-size="14" fill="#212529" text-anchor="middle" font-weight="bold" dominant-baseline="middle">未支付</text><text x="695.0" y="234.0" font-size="11" fill="#212529" text-anchor="middle" font-weight="normal" dominant-baseline="middle">取消订单，释放库存</text>
<line x1="620" y1="144" x2="537" y2="198" stroke="#2f9e44" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="650" y1="144" x2="693" y2="198" stroke="#e03131" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="400" y="280" font-size="13" fill="#e03131" text-anchor="middle" font-weight="normal" dominant-baseline="middle">不用写定时任务每分钟扫一遍数据库，到点了 MQ 会把消息送过来</text>
</svg>
