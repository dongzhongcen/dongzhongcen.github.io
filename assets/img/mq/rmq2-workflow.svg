<text x="40" y="444" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">② 生产者把消息连同 RoutingKey 发给某个 Virtual Host 里的 Exchange</text>
<text x="40" y="470" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">③ Exchange 按 Binding 规则把消息路由到一个或多个 Queue，消息在队列里排队等待</text>
<text x="40" y="496" font-size="13" fill="#212529" text-anchor="start" font-weight="normal" dominant-baseline="middle">④ 消费者同样建立 Connection 和 Channel，订阅 Queue；消息被推给消费者，消费者确认后从队列删除</text>
